[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids"
version = "0.1.0"
description = "Phát hiện tấn công mạng dựa trên lưu lượng mạng bằng học máy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scapy>=2.5",
    "networkx>=3.2",
    "PyYAML>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
